# No healthcheckPath in railway.toml on purpose: this service has a volume
# (/data), and Railway attaches a volume to only one deployment at a time, so
# a healthcheck-gated rollout can never become healthy while the old
# deployment holds the volume.

providers = ["node"]

[variables]
# Declaring ANY [variables] section replaces nixpacks' node-provider defaults,
# which is how NODE_ENV=production silently vanished from the image once and
# blanked the site - so set it explicitly and keep this list complete.
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["nodejs_22", "python3"]
aptPkgs = ["build-essential"]

[phases.install]
cmds = ["npm install", "cd client && npm install"]

[phases.build]
cmds = ["cd client && npm run build", "npm run build:server"]

[start]
cmd = "npm start"
